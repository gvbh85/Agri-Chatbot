<!DOCTYPE html>
<html>
<head>
    <title>Agri Decision-Making Chatbot</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; }
        .chat-box { width: 400px; margin: 50px auto; background: white; padding: 10px; border-radius: 5px; }
        .messages { height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 5px; }
        .user { text-align: right; color: blue; margin: 5px; }
        .bot { text-align: left; color: green; margin: 5px; }
        input, select, button { margin-top: 5px; padding: 5px; }
    </style>
</head>
<body>
<div class="chat-box">
    <h3>🌾 Agri Chatbot</h3>
    <select id="language">
        <option value="en">English</option>
        <option value="te">Telugu</option>
        <option value="hi">Hindi</option>
    </select>
    <div class="messages" id="messages"></div>
    <input type="text" id="message" placeholder="Type your question..." />
    <br>
    <button onclick="sendMessage()">Send</button>
    <button onclick="startVoice()">🎙 Speak</button>
</div>

<script>
function startVoice() {
    if (!('webkitSpeechRecognition' in window)) {
        alert("Speech recognition not supported");
        return;
    }
    const recognition = new webkitSpeechRecognition();
    recognition.lang = 'en-IN';
    recognition.continuous = false;
    recognition.onresult = function(event) { document.getElementById("message").value = event.results[0][0].transcript; }
    recognition.start();
}

function speak(text) {
    let speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-IN";
    window.speechSynthesis.speak(speech);
}

function sendMessage() {
    const msg = document.getElementById("message").value;
    const lang = document.getElementById("language").value;
    if (!msg) return;

    const messages = document.getElementById("messages");
    messages.innerHTML += `<div class="user">${msg}</div>`;

    fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg, language: lang })
    })
    .then(res => res.json())
    .then(data => {
        messages.innerHTML += `<div class="bot">${data.reply}</div>`;
        speak(data.reply);
        document.getElementById("message").value = "";
        messages.scrollTop = messages.scrollHeight;
    })
    .catch(err => { messages.innerHTML += `<div class="bot">Error occurred</div>`; });
}
</script>
</body>
</html>
